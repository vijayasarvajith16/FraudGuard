# frontend pipeline. Runs only when this service or the shared pipeline it uses changes (docs/ci.md).
name: frontend

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
      - .github/workflows/_node-service.yml
      - .github/workflows/_container-image.yml
  pull_request:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/frontend.yml
      - .github/workflows/_node-service.yml
      - .github/workflows/_container-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named after the service so its checks are unique (branch protection matches check names).
  frontend:
    uses: ./.github/workflows/_node-service.yml
    permissions:
      contents: write # the release job commits the image-tag bump (GitOps)
      packages: write
      security-events: write
    with:
      path: frontend
      image: fraudguard-frontend
      values-file: infra/helm/values/values-frontend.yaml
