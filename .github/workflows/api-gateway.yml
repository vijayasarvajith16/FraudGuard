# api-gateway pipeline (Nginx). There is no application code to unit-test: the rendered config is
# validated with `nginx -t`, and its behaviour is covered by the black-box tests in e2e.yml.
name: api-gateway

on:
  push:
    branches: [main]
    paths:
      - services/api-gateway/**
      - .github/workflows/api-gateway.yml
      - .github/workflows/_container-image.yml
  pull_request:
    branches: [main]
    paths:
      - services/api-gateway/**
      - .github/workflows/api-gateway.yml
      - .github/workflows/_container-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: api-gateway / config test, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render the templates and validate the config
        run: |
          docker build -q -t gateway:ci services/api-gateway
          docker run --rm -e NGINX_RESOLVER=127.0.0.11 \
            -e CORS_ALLOWED_ORIGINS="http://localhost:8080 http://localhost:5173" \
            gateway:ci sh -c '/docker-entrypoint.sh nginx -t'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Lint the black-box tests
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.9
          ruff check services/api-gateway/tests
          ruff format --check services/api-gateway/tests

      - name: Version
        id: version
        run: echo "version=$(tr -d '[:space:]' < services/api-gateway/VERSION)" >> "$GITHUB_OUTPUT"

  image:
    name: api-gateway
    needs: verify
    uses: ./.github/workflows/_container-image.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      context: services/api-gateway
      image: fraudguard-api-gateway
      version: ${{ needs.verify.outputs.version }}
