# auth-service pipeline. Runs only when this service or the shared pipeline it uses changes (docs/ci.md).
name: auth-service

on:
  push:
    branches: [main]
    paths:
      - services/auth-service/**
      - .github/workflows/auth-service.yml
      - .github/workflows/_node-service.yml
      - .github/workflows/_container-image.yml
  pull_request:
    branches: [main]
    paths:
      - services/auth-service/**
      - .github/workflows/auth-service.yml
      - .github/workflows/_node-service.yml
      - .github/workflows/_container-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named after the service so its checks are unique (branch protection matches check names).
  auth-service:
    uses: ./.github/workflows/_node-service.yml
    permissions:
      contents: write # the release job commits the image-tag bump (GitOps)
      packages: write
      security-events: write
    with:
      path: services/auth-service
      image: fraudguard-auth-service
      values-file: infra/helm/values/values-auth-service.yaml
