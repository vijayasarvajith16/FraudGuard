# deep-scan-service pipeline. Runs only when this service or the shared pipeline it uses changes (docs/ci.md).
name: deep-scan-service

on:
  push:
    branches: [main]
    paths:
      - services/deep-scan-service/**
      - .github/workflows/deep-scan-service.yml
      - .github/workflows/_python-service.yml
      - .github/workflows/_container-image.yml
  pull_request:
    branches: [main]
    paths:
      - services/deep-scan-service/**
      - .github/workflows/deep-scan-service.yml
      - .github/workflows/_python-service.yml
      - .github/workflows/_container-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named after the service so its checks are unique (branch protection matches check names).
  deep-scan-service:
    uses: ./.github/workflows/_python-service.yml
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      path: services/deep-scan-service
      image: fraudguard-deep-scan-service
