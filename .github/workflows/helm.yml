# Helm charts, the kind setup, the Argo CD app-of-apps and the monitoring add-ons: lint every chart
# with every service's values, render everything (the upstream monitoring charts with this
# repository's values) and validate the manifests against the Kubernetes API schema and the Argo CD
# CRD schemas (kubeconform, strict). Then unit-test the alert rules and check the dashboard queries.
name: helm

on:
  push:
    branches: [main]
    paths:
      - infra/helm/**
      - infra/kind/**
      - infra/argocd/**
      - infra/monitoring/**
      - tests/monitoring/**
      - .github/workflows/helm.yml
  pull_request:
    branches: [main]
    paths:
      - infra/helm/**
      - infra/kind/**
      - infra/argocd/**
      - infra/monitoring/**
      - tests/monitoring/**
      - .github/workflows/helm.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  KUBERNETES_VERSION: 1.34.0 # schema version for validation
  KUBECONFORM_VERSION: 0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
  TRAEFIK_CHART_VERSION: 41.6.1 # keep in sync with infra/kind/k8s.sh
  # Argo CD CRD schemas (Application, AppProject), pinned to a commit of the community catalog.
  CRD_SCHEMAS: https://raw.githubusercontent.com/datreeio/CRDs-catalog/d373c2da9702bc9509a004db83e57263fe3bdfc1/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

jobs:
  charts:
    name: lint, render, validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install kubeconform (checksum-verified release binary)
        run: |
          tarball=kubeconform-linux-amd64.tar.gz
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/${tarball}"
          echo "${KUBECONFORM_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Lint
        run: |
          for values in infra/helm/values/values-*.yaml; do
            echo "::group::service chart with ${values}"
            helm lint --strict infra/helm/service -f "$values"
            echo "::endgroup::"
          done
          helm lint --strict infra/helm/mongodb
          helm lint --strict infra/helm/rabbitmq
          helm lint --strict infra/argocd/apps

      - name: Render the monitoring add-ons with this repository's values
        run: |
          mkdir -p rendered
          # Chart pins from the app-of-apps values, the same source Argo CD and infra/kind/k8s.sh use.
          yq '.monitoring.charts[] | [.name, (.namespace // "monitoring"), .repoURL, .chart, .version, (.valueFiles | join(","))] | join(" ")' \
            infra/argocd/apps/values.yaml |
            while read -r name ns repo chart version values; do
              args=()
              for f in ${values//,/ }; do args+=(-f "infra/monitoring/$f"); done
              echo "::group::${name} ${version} (${repo})"
              # Argo CD renders with the cluster's API versions; an offline render must name the ones
              # the charts test for (prometheus-adapter falls back to a removed APIService version).
              helm template "$name" "$chart" --repo "$repo" --version "$version" -n "$ns" "${args[@]}" \
                --api-versions apiregistration.k8s.io/v1 > "rendered/monitoring-${name}.yaml"
              grep -E '^kind: ' "rendered/monitoring-${name}.yaml" | sort | uniq -c
              echo "::endgroup::"
            done
          kubectl kustomize infra/monitoring/manifests > rendered/monitoring-manifests.yaml

      - name: Render and validate
        run: |
          mkdir -p rendered
          for values in infra/helm/values/values-*.yaml; do
            svc=$(basename "$values" .yaml); svc=${svc#values-}
            helm template "$svc" infra/helm/service -n fraudguard -f "$values" > "rendered/${svc}.yaml"
          done
          helm template mongodb infra/helm/mongodb -n fraudguard > rendered/mongodb.yaml
          helm template rabbitmq infra/helm/rabbitmq -n fraudguard > rendered/rabbitmq.yaml
          cp infra/argocd/platform/namespace.yaml rendered/
          helm template fraudguard infra/argocd/apps > rendered/argocd-apps.yaml
          cp infra/argocd/root.yaml rendered/argocd-root.yaml
          kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default -schema-location "$CRD_SCHEMAS" rendered/

      - name: Alert rule unit tests and dashboard queries (promtool)
        run: bash tests/monitoring/run.sh

      - name: Ingress controller values render against the pinned chart
        run: |
          helm repo add traefik https://traefik.github.io/charts
          helm template traefik traefik/traefik --version "$TRAEFIK_CHART_VERSION" \
            -f infra/kind/traefik-values.yaml > /dev/null
