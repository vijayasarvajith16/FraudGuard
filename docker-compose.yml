# FraudGuard local development stack.
# Sized for a 16 GB laptop: every container has a memory limit.
# Ports bind to 127.0.0.1 only. Credentials come from .env (copy .env.example).

name: fraudguard

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongodb:
    image: mongo:7.0
    container_name: fraudguard-mongodb
    hostname: mongodb
    # Single-node replica set: required for multi-document transactions (docs/contracts.md §0.1).
    entrypoint: ["bash", "/fraudguard/entrypoint.sh"]
    command:
      - mongod
      - --replSet
      - rs0
      - --keyFile
      - /tmp/mongo-keyfile
      - --bind_ip_all
      - --wiredTigerCacheSizeGB
      - "0.25"
      - --quiet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-fraudguard}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-fraudguard-dev}
      # Per-service users, created by infra/mongo/init (first volume init, or `make mongo-users`).
      MONGO_AUTH_PASSWORD: ${MONGO_AUTH_PASSWORD:?set MONGO_AUTH_PASSWORD in .env}
      MONGO_TRANSACTIONS_PASSWORD: ${MONGO_TRANSACTIONS_PASSWORD:?set MONGO_TRANSACTIONS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
      - ./infra/mongo:/fraudguard:ro
    healthcheck:
      # Initiates the replica set on first start; healthy once this node is a writable primary.
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin /fraudguard/healthcheck.js
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fraudguard-rabbitmq
    hostname: fraudguard-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-fraudguard}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-fraudguard-dev}
    ports:
      - "127.0.0.1:${RABBITMQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_HOST_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # rabbitmq-diagnostics boots an Erlang CLI VM (~3 s idle), so allow a generous timeout:
      # under build or test load a tight one flips the broker to unhealthy and stalls dependents.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 15s
      timeout: 20s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    logging: *default-logging

  auth-service:
    build:
      context: ./services/auth-service
    image: fraudguard/auth-service:dev
    container_name: fraudguard-auth-service
    environment:
      NODE_ENV: production
      PORT: 3001
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 1
      MONGO_URI: mongodb://auth_service:${MONGO_AUTH_PASSWORD}@mongodb:27017/fraudguard_auth?authSource=fraudguard_auth
      MONGO_DB: fraudguard_auth
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Demo stack: longer tokens so a demo is not interrupted (docs/contracts.md §0.4).
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${AUTH_HOST_PORT:-3001}:3001"
    depends_on:
      mongodb:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    logging: *default-logging

  transaction-service:
    build:
      context: ./services/transaction-service
    image: fraudguard/transaction-service:dev
    container_name: fraudguard-transaction-service
    environment:
      NODE_ENV: production
      PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 1
      MONGO_URI: mongodb://transaction_service:${MONGO_TRANSACTIONS_PASSWORD}@mongodb:27017/fraudguard_transactions?authSource=fraudguard_transactions&replicaSet=rs0
      MONGO_DB: fraudguard_transactions
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-fraudguard}:${RABBITMQ_DEFAULT_PASS:-fraudguard-dev}@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      AUTH_SERVICE_URL: http://auth-service:3001
      QUICK_SCAN_URL: http://quick-scan-service:8001
      QUICK_SCAN_TIMEOUT_MS: ${QUICK_SCAN_TIMEOUT_MS:-300}
    ports:
      - "127.0.0.1:${TRANSACTION_HOST_PORT:-3002}:3002"
    depends_on:
      mongodb:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      quick-scan-service:
        condition: service_healthy
      # Only started, not healthy: the outbox tolerates a broker that is still booting (contract §9).
      rabbitmq:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped
    logging: *default-logging

  # Scan services load their model from the MLflow registry at startup (docs/contracts.md §4.1)
  # and exit non-zero if they cannot. Host ports are for local debugging only; the gateway
  # never routes to them.
  quick-scan-service:
    build:
      context: ./services/quick-scan-service
    image: fraudguard/quick-scan-service:dev
    container_name: fraudguard-quick-scan-service
    environment: &scan-env
      LOG_LEVEL: ${SCAN_LOG_LEVEL:-INFO}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:?set MLFLOW_TRACKING_URI in .env}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
      MODEL_URI: models:/fraudguard-quick-scan@production
    ports:
      - "127.0.0.1:${QUICK_SCAN_HOST_PORT:-8001}:8001"
    deploy:
      resources:
        limits:
          memory: 320m  # measured ~180 MiB steady and under load
    restart: unless-stopped
    logging: *default-logging

  deep-scan-service:
    build:
      context: ./services/deep-scan-service
    image: fraudguard/deep-scan-service:dev
    container_name: fraudguard-deep-scan-service
    environment:
      <<: *scan-env
      MODEL_URI: models:/fraudguard-deep-scan@production
      TIER_MEDIUM_MIN: ${TIER_MEDIUM_MIN:-0.30}
      TIER_HIGH_MIN: ${TIER_HIGH_MIN:-0.70}
      TIER_CRITICAL_MIN: ${TIER_CRITICAL_MIN:-0.90}
      # Consumes transactions.flagged, publishes transactions.scored (docs/contracts.md §3).
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-fraudguard}:${RABBITMQ_DEFAULT_PASS:-fraudguard-dev}@rabbitmq:5672
      MAX_RETRIES: 3
      PREFETCH: 10
    ports:
      - "127.0.0.1:${DEEP_SCAN_HOST_PORT:-8002}:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384m  # measured ~125 MiB; headroom for the RabbitMQ consumer and prefetch (Phase 5)
    restart: unless-stopped
    logging: *default-logging

volumes:
  mongo-data:
  rabbitmq-data:
