# FraudGuard frontend: static SPA server (docs/contracts.md §8.1). Runs as the unprivileged nginx user.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    sendfile on;

    # Writable temp paths for a non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format json escape=json
        '{"time":"$time_iso8601","level":"info","service":"frontend","msg":"request completed",'
        '"requestId":"$http_x_request_id","method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"durationSeconds":$request_time,"clientIp":"$remote_addr"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    client_max_body_size 1k;  # static files only

    include /etc/nginx/conf.d/*.conf;
}
