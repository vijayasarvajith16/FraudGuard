# Included in each location: nginx drops inherited add_header directives in a location that declares its own.
# Behind the compose gateway, X-Frame-Options, X-Content-Type-Options and Referrer-Policy are hidden
# and re-added by the gateway, so each is sent once; the CSP passes through.
add_header Content-Security-Policy  $csp always;
add_header X-Content-Type-Options   nosniff always;
add_header X-Frame-Options          DENY always;
add_header Referrer-Policy          no-referrer always;
add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), payment=()" always;
