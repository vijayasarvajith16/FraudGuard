[project]
name = "fraudguard-tools"
version = "1.0.0"
description = "Demo tooling: dataset replay through the gateway and frontend risk-profile samples"
requires-python = ">=3.11"
dependencies = []  # standard library only (docs/contracts.md §8.2)

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
