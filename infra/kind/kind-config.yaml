# Local Kubernetes cluster for FraudGuard (make k8s-up). One node keeps the footprint small; the
# ingress controller is published on 127.0.0.1:<hostPort> only. infra/kind/k8s.sh replaces the host
# port with KIND_HTTP_PORT (default 8089) when it creates the cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fraudguard
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      # Since Kubernetes 1.35 the kubelet refuses to start on cgroup v1 hosts by default. Docker
      # Desktop on an older WSL2 kernel (5.15) still uses cgroup v1 (`docker info` shows the cgroup
      # version); this keeps the cluster working there and is a no-op on cgroup v2. The lasting fix
      # is a cgroup v2 host (`wsl --update`; docs/kubernetes.md).
      - |
        kind: KubeletConfiguration
        failCgroupV1: false
      # etcd fsyncs every write; through Docker Desktop's virtual disk a single fsync took 4-5 s
      # under load (healthy: ~10 ms), stalling the API server until probes restarted it and every
      # pod with it. A disposable local cluster can skip fsync: the data still lives on disk, only
      # a crash of the node container could lose the last writes. Never do this in production.
      - |
        kind: ClusterConfiguration
        etcd:
          local:
            extraArgs:
              - name: unsafe-no-fsync
                value: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8089
        listenAddress: "127.0.0.1"
        protocol: TCP
