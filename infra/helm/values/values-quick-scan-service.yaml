# quick-scan-service (docs/contracts.md §4): synchronous Isolation Forest scoring on every transfer.
# Profile: LOW LATENCY, SMALL. It sits on the transfer's hot path (300 ms budget), so it reserves
# a real CPU share (requests) to avoid being starved under contention, while memory stays tight
# (measured ~180 MiB steady and under load).
image:
  repository: ghcr.io/vijayasarvajith16/fraudguard-quick-scan-service
  tag: sha-0ad39867f72927c4a013af367f8f9bd6b49abc08

port: 8001
runAsUser: 10001

config:
  PORT: "8001"
  LOG_LEVEL: INFO
  HOME: /tmp # read-only root filesystem: library caches go to the writable /tmp
  MLFLOW_TRACKING_URI: https://dagshub.com/vijayasarvajith16/fraudguard.mlflow
  # The model version running here is pinned in Git. The model-promotion workflow rewrites this
  # line when it promotes a version (docs/mlops.md); Argo CD then rolls the pods.
  MODEL_URI: models:/fraudguard-quick-scan/3
  GIT_PYTHON_REFRESH: quiet
  MLFLOW_DISABLE_AGENT_HINT: "1"

secretEnv:
  # Optional: the registry is public; set these in .env only for a private one.
  MLFLOW_TRACKING_USERNAME: { secret: fraudguard-secrets, key: MLFLOW_TRACKING_USERNAME, optional: true }
  MLFLOW_TRACKING_PASSWORD: { secret: fraudguard-secrets, key: MLFLOW_TRACKING_PASSWORD, optional: true }

probes:
  # The model is downloaded at startup (§4.1): allow up to 3 minutes before liveness applies.
  startup: { path: /health, periodSeconds: 5, failureThreshold: 36 }

writableSizeLimit: 256Mi # model artifacts are downloaded to /tmp

resources:
  requests: { cpu: 250m, memory: 256Mi }
  limits: { cpu: "1", memory: 320Mi }

# Scales on CPU: scoring is CPU-bound and synchronous, so CPU tracks load directly. Fast scale-up
# (the 300 ms hot path), slow scale-down (no flapping). Each new pod downloads the model first.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60 # of the 250m request
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
