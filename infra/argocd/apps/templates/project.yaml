# The FraudGuard Applications may only deploy from this repository into the fraudguard namespace,
# and the only cluster-scoped kind they may create is that Namespace.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fraudguard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: FraudGuard services and their data stores
  sourceRepos:
    - {{ .Values.repoURL }}
  destinations:
    - server: https://kubernetes.default.svc
      namespace: {{ .Values.namespace }}
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: networking.k8s.io
      kind: Ingress
