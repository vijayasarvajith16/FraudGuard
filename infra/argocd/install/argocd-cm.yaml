# Merged into Argo CD's argocd-cm by `make k8s-up` (infra/kind/k8s.sh).
data:
  # Poll Git every 60 s (default 180 s). A local cluster cannot receive GitHub webhooks, and polling
  # keeps it that way: nothing on the machine is reachable from the internet.
  timeout.reconciliation: 60s
  # Give Application resources a health status. Without it Argo CD considers a child Application
  # healthy as soon as it exists, and the app-of-apps sync waves would not wait for the previous
  # wave (e.g. MongoDB) to actually be up.
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
