# FraudGuard API gateway (docs/contracts.md §8). Runs as the unprivileged nginx user.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    include /etc/nginx/mime.types;
    default_type application/json;
    charset utf-8;

    # Writable temp paths for a non-root user.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Request ID: keep a well-formed incoming X-Request-Id, otherwise generate one (contract §0.3).
    map $http_x_request_id $req_id {
        default                      $request_id;
        "~^[A-Za-z0-9._-]{1,128}$"   $http_x_request_id;
    }

    # CORS: $cors_allowed_origin is set from CORS_ALLOWED_ORIGINS at startup
    # (docker-entrypoint.d/20-cors-origins.sh). The other headers are sent only for allowed origins.
    map $cors_allowed_origin $cors_allow_methods  { "" ""; default "GET, POST, PATCH, OPTIONS"; }
    map $cors_allowed_origin $cors_allow_headers  { "" ""; default "Authorization, Content-Type, Idempotency-Key, X-Request-Id"; }
    map $cors_allowed_origin $cors_expose_headers { "" ""; default "X-Request-Id, Idempotent-Replayed"; }
    map $cors_allowed_origin $cors_max_age        { "" ""; default "600"; }

    log_format json escape=json
        '{"time":"$time_iso8601","level":"info","service":"api-gateway","msg":"request completed",'
        '"requestId":"$req_id","method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"durationSeconds":$request_time,"upstream":"$upstream_addr",'
        '"upstreamStatus":"$upstream_status","upstreamSeconds":"$upstream_response_time",'
        '"clientIp":"$remote_addr","userAgent":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Rate limits per client IP (contract §8).
    limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_status 429;

    client_max_body_size  100k;
    proxy_connect_timeout 2s;
    proxy_send_timeout    10s;
    proxy_read_timeout    10s;

    # Upstreams are defined in conf.d/default.conf (rendered from templates/), where NGINX_RESOLVER
    # is available: they re-resolve service names at runtime.

    include /etc/nginx/conf.d/*.conf;
}
